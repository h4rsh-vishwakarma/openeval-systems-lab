services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: openeval
      POSTGRES_USER: openeval
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openeval -d openeval"]
      interval: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redis_data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10
  api-python:
    build:
      context: ../..
      dockerfile: services/api-python/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://openeval:${POSTGRES_PASSWORD:-local-development-only}@postgres:5432/openeval
      REDIS_URL: redis://redis:6379/0
      API_TOKEN: ${API_TOKEN:?Set API_TOKEN in .env}
      API_TOKENS_JSON: ${API_TOKENS_JSON:-}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:8080}
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      retries: 10
  worker:
    build:
      context: ../..
      dockerfile: services/worker/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://openeval:${POSTGRES_PASSWORD:-local-development-only}@postgres:5432/openeval
      REDIS_URL: redis://redis:6379/0
      MAX_ATTEMPTS: ${MAX_ATTEMPTS:-3}
      TASK_TIMEOUT_SECONDS: ${TASK_TIMEOUT_SECONDS:-30}
    depends_on:
      api-python: {condition: service_healthy}
  api-typescript:
    build:
      context: ../..
      dockerfile: services/api-typescript/Dockerfile
    environment:
      API_BASE_URL: http://api-python:8000
      API_TOKEN: ${API_TOKEN:?Set API_TOKEN in .env}
    ports: ["127.0.0.1:3000:3000"]
    depends_on:
      api-python: {condition: service_healthy}
  client:
    build:
      context: ../..
      dockerfile: client/Dockerfile
    ports: ["8080:80"]
    depends_on:
      api-python: {condition: service_healthy}
volumes:
  postgres_data:
  redis_data:
