name: CI
on: [push, pull_request]
jobs:
  python-and-typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Secret scan
        run: docker run --rm -v "$PWD:/workspace" zricethezav/gitleaks:latest git /workspace --no-banner --redact
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Install Python dependencies
        run: pip install -r services/api-python/requirements.txt
      - name: Evaluator unit tests
        run: pytest tests/unit/test_evaluator.py -q
      - name: Gateway build and tests
        working-directory: services/api-typescript
        run: npm ci && npm run build && npm test
      - name: Client build
        working-directory: client
        run: npm ci && npm run build
      - name: Compose validation
        env: {API_TOKEN: ci-placeholder-token}
        run: docker compose -f infra/docker/compose.yml config -q
      - name: Build containers
        env: {API_TOKEN: ci-placeholder-token}
        run: docker compose -f infra/docker/compose.yml build
      - name: Start integration stack
        env: {API_TOKEN: ci-placeholder-token}
        run: docker compose -f infra/docker/compose.yml up -d --wait
      - name: Workflow integration tests
        env: {API_TOKEN: ci-placeholder-token}
        run: pytest tests/integration -q
      - name: Container logs
        if: failure()
        env: {API_TOKEN: ci-placeholder-token}
        run: docker compose -f infra/docker/compose.yml logs --tail=150
      - name: Stop stack
        if: always()
        env: {API_TOKEN: ci-placeholder-token}
        run: docker compose -f infra/docker/compose.yml down -v
  data-pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - run: pip install -r data-pipeline/requirements.txt
      - run: pytest tests/unit/test_pipeline.py -q
